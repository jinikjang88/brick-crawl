<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브릭 크롤</title>
<style>
:root{
  --bg:#EFE8DA; --panel:#FFFDF8; --field:#F9F6EF; --ink:#1B1A18; --ink2:#5B5750; --ink3:#A39E93; --line:#D6CDBC; --accent:#C1443C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1D1B18; --panel:#2B2823; --field:#23211D; --ink:#EEE9DF; --ink2:#B7B1A6; --ink3:#6F6A61; --line:#3E3A33; --accent:#D2574F; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#1D1B18; --panel:#2B2823; --field:#23211D; --ink:#EEE9DF; --ink2:#B7B1A6; --ink3:#6F6A61; --line:#3E3A33; --accent:#D2574F; color-scheme:dark; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit}
button:focus-visible{outline:3px solid var(--ink2);outline-offset:2px}

.app{max-width:460px;margin:0 auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.hStage{font-size:14px;color:var(--ink2);font-weight:600;min-height:21px}
.hName{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hRight{display:flex;align-items:center;gap:8px}
.hCoin{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.iconBtn{width:44px;height:44px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:800;border-radius:3px;cursor:pointer}
.orbBar{font-size:14px;color:var(--ink2);min-height:21px}
.orbBar b{color:var(--ink)}
.abil{display:flex;flex-wrap:wrap;gap:4px;min-height:24px;font-size:13px}
.abil span{border:2px solid var(--ink3);background:var(--panel);padding:0 7px;border-radius:2px;font-weight:600;line-height:20px}
.abil .none{border:0;background:none;color:var(--ink3);font-weight:500}

.stageWrap{display:flex;justify-content:center}
.stage{position:relative;aspect-ratio:9/17;width:clamp(240px,calc((100vh - 160px) * .5294),100%);width:clamp(240px,calc((100svh - 160px) * .5294),100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--ink);border-radius:2px;touch-action:none;cursor:pointer}

.ov{position:absolute;inset:2px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;background:var(--bg);background:color-mix(in srgb,var(--bg) 95%,transparent);overflow:auto;z-index:5}
.ov.on{display:flex}
#ovPause{z-index:8}
.logo{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.big{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.big.lose{color:var(--accent)}
.sub{font-size:15px;color:var(--ink2);margin:0}
.btn{min-height:48px;padding:0 20px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:700;font-size:16px;border-radius:3px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-size:12px;font-weight:500;opacity:.8;line-height:1.2}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;min-height:44px;cursor:pointer;font-size:15px}
.mainBtns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:260px}
.mainBtns .btn{min-height:56px}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.cards{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
.rCard{display:block;width:100%;text-align:left;padding:9px 14px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer;min-height:56px}
.rCard:active{transform:translateY(1px)}
.rCard:disabled{opacity:.4;cursor:default}
.rCard b{display:flex;justify-content:space-between;gap:8px;font-size:18px;font-weight:800;line-height:1.3}
.rCard b em{font-style:normal;font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.rCard span{font-size:14px;color:var(--ink2)}
.rCard.rare{border-color:var(--accent)}
.rCard.rare b{color:var(--accent)}

.ovMap{justify-content:flex-start;gap:4px;padding:12px 10px;background:var(--bg)}
.mapHead .t{font-size:22px;font-weight:900;letter-spacing:-.02em}
.mapHead .s{font-size:14px;color:var(--ink2)}
.mapBox{position:relative;flex:1;width:100%;min-height:280px}
.mapBox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);min-width:58px;min-height:44px;padding:0 8px;border:2px solid var(--ink3);background:var(--panel);color:var(--ink3);font-weight:800;font-size:15px;border-radius:3px}
.node.reach{border-color:var(--ink);color:var(--ink);cursor:pointer;animation:nudge 1s steps(2) infinite}
.node.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.node.boss{border-color:var(--accent);color:var(--accent);min-width:76px}
.node.boss.done{background:var(--accent);color:var(--bg)}
@keyframes nudge{50%{transform:translate(-50%,calc(-50% - 2px))}}

.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .25s}
.banner.on{opacity:1}
.banner .b1{font-size:15px;font-weight:700;color:var(--ink2)}
.banner .b2{font-size:32px;font-weight:900;letter-spacing:-.03em;color:var(--ink);background:var(--field);display:inline-block;padding:0 12px}
.banner.hot .b2{color:var(--accent)}

@media (prefers-reduced-motion: reduce){ .banner{transition:none} .node.reach{animation:none} }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div>
      <div class="hStage" id="hStage"></div>
      <div class="hName" id="hName">브릭 크롤</div>
    </div>
    <div class="hRight">
      <span class="hCoin" id="hCoin"></span>
      <button class="iconBtn" id="btnMenu" aria-label="메뉴">II</button>
    </div>
  </header>
  <div class="orbBar" id="orbBar"></div>
  <div class="abil" id="abil" aria-label="보유 유물"></div>

  <div class="stageWrap"><div class="stage">
    <canvas id="cv" aria-label="위는 전투 화면, 아래는 벽돌판"></canvas>
    <div class="banner" id="banner"><div class="b1" id="bn1"></div><div class="b2" id="bn2"></div></div>

    <div class="ov on" id="ovMain">
      <div class="logo">브릭 크롤</div>
      <p class="sub" id="mRecord"></p>
      <div class="mainBtns">
        <button class="btn primary" id="mContinue" hidden></button>
        <button class="btn" id="mNew">새 원정</button>
      </div>
    </div>

    <div class="ov ovMap" id="ovMap">
      <div class="mapHead"><div class="t" id="mapTitle"></div><div class="s" id="mapSub"></div></div>
      <div class="mapBox" id="mapBox"></div>
    </div>

    <div class="ov" id="ovChoose">
      <div class="big" id="cTitle"></div>
      <p class="sub" id="cSub"></p>
      <div class="cards" id="cCards"></div>
      <div class="btnRow" id="cBtns"></div>
    </div>

    <div class="ov" id="ovPause">
      <div class="big">메뉴</div>
      <button class="btn primary" id="pResume">계속하기</button>
      <button class="btn" id="pMain">메인 화면<small id="pMainSub"></small></button>
      <button class="linkbtn" id="pGiveup">원정 포기</button>
    </div>
  </div></div>
</div>

<script>
(() => {
'use strict';
// ── 레이아웃: 위 110px는 전투, 아래는 벽돌판. 저해상도로 그린 뒤 CSS로 키워 도트 느낌을 낸다
const W = 180, H = 340, BT = 110, FLOOR = 330;
const COLS = 7, CW = 24, OX = 6, RIGHT = OX + COLS * CW, ROWH = 14, BRH = 12, MAXROW = 11;
const CRASH_Y = BT + 4 + MAXROW * ROWH - 1;
const PX = 44, MX = 136, BALL_SPEED = 300;
const AIM_MIN = -Math.PI + 0.22, AIM_MAX = -0.22;   // 너무 눕힌 각도는 벽만 타므로 뺀다
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => Math.floor(Math.random() * n);
const pickOne = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rowY = r => BT + 4 + r * ROWH;
function pickW(w){ let x = Math.random() * Object.values(w).reduce((a, b) => a + b, 0); for (const k in w){ x -= w[k]; if (x < 0) return k; } return Object.keys(w)[0]; }

const C = {};
function readColors(){
  const s = getComputedStyle(document.documentElement);
  ['bg','panel','field','ink','ink2','ink3','line','accent'].forEach(k => C[k] = s.getPropertyValue('--' + k).trim());
}
readColors();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch(e){}

// ── 몬스터: 숫자 인플레이션을 막기 위해 세션 상승폭은 작게(체력 +35%, 공·방 +1)
const MON = {
  slime: { name:'슬라임', spr:'slime', hp:6, atk:1, def:0, sweep:1.1,
    pattern:[{t:'atk',m:1},{t:'atk',m:1},{t:'wait'}],
    row:{ d:.55, hard:0, stat:.5, w:{ atk:1 } } },
  bat: { name:'박쥐', spr:'bat', hp:8, atk:1, def:0, sweep:1.3,
    pattern:[{t:'atk',m:1},{t:'atk',m:1},{t:'charge'},{t:'atk',m:2.5}],
    row:{ d:.6, hard:.2, stat:.4, w:{ atk:1, def:1 } } },
  golem: { name:'골렘', spr:'golem', hp:9, atk:1, def:2, sweep:1.5,
    pattern:[{t:'atk',m:1},{t:'guard',v:2},{t:'atk',m:1.5}],
    row:{ d:.6, hard:.25, stat:.4, w:{ atk:2, def:1 } } },
  shroom: { name:'독버섯', spr:'shroom', hp:9, atk:1, def:1, sweep:1.7,
    pattern:[{t:'atk',m:1},{t:'poison',v:2},{t:'atk',m:1},{t:'spore'}],
    row:{ d:.62, hard:.3, stat:.4, w:{ atk:1, def:1, heal:1 }, poison:.2 } },
  boss: { name:'탑의 주인', spr:'boss', hp:16, atk:1, def:1, sweep:2.0, boss:true,
    pattern:[{t:'atk',m:1},{t:'summon'},{t:'charge'},{t:'atk',m:2.4}],
    pattern2:[{t:'atk',m:1},{t:'summon'},{t:'atk',m:1},{t:'charge'},{t:'atk',m:2.25}],
    row:{ d:.62, hard:.35, stat:.35, w:{ atk:1, def:1, heal:1 }, poison:.3 } },
};
// 성벽 밀도·시작 줄 수: 구슬이 튕기는 구조라 틈이 있어야 천장까지 길을 낼 수 있다
const WALL = { dens:0.5, init:3, every:2, hpMul:0.6 };
const SCALE = { hp:0.35, atk:1, def:1, sweep:0.15, sweepMax:2.6, elite:1.5 };
function monCfg(id, s, elite){
  const b = MON[id];
  return Object.assign({}, b, {
    id, elite:!!elite, name:(elite ? '정예 ' : '') + b.name,
    hp: Math.max(3, Math.round(b.hp * WALL.hpMul * (1 + SCALE.hp * s) * (elite ? SCALE.elite : 1))),
    atk: b.atk + SCALE.atk * s,
    def: b.def + SCALE.def * s + (elite ? 1 : 0),
    sweep: Math.min(SCALE.sweepMax, b.sweep + SCALE.sweep * s + (elite ? 0.1 : 0)),
  });
}

// ── 구슬: 덱에서 한 턴에 하나씩 꺼내 쏜다. 구슬마다 손맛이 달라야 한다
const ORBS = {
  basic: { name:'기본 구슬',   icon:'o_basic', rar:0, desc:'특별한 효과 없음' },
  bomb:  { name:'폭탄 구슬',   icon:'o_bomb',  rar:1, desc:'처음 부순 벽돌의 주변 8칸이 함께 터진다' },
  drill: { name:'송곳 구슬',   icon:'o_drill', rar:1, desc:'어떤 벽돌이든 3개까지 한 번에 뚫는다' },
  guard: { name:'방패 구슬',   icon:'shield',  rar:1, desc:'벽돌을 부술 때마다 방어도 +1' },
  split: { name:'분열 구슬',   icon:'o_split', rar:2, desc:'세 갈래로 갈라져 발사된다' },
  venom: { name:'독 구슬',     icon:'skull',   rar:2, desc:'천장을 칠 때마다 몬스터에게 독 +1' },
  heavy: { name:'묵직한 구슬', icon:'o_heavy', rar:2, desc:'천장 타격 피해가 2배' },
};
// ── 유물: 원정 내내 유지되는 패시브
const RELICS = {
  combo:    { name:'천장 연타', max:2, desc:'구슬 하나가 천장을 칠 수 있는 횟수 +1 (기본 3회)' },
  counter:  { name:'반격',      max:1, desc:'몬스터 공격을 방어도로 막은 만큼 되돌려준다' },
  antidote: { name:'해독',      max:1, desc:'독 피해를 받을 때마다 독이 2씩 줄어든다' },
  focus:    { name:'집중',      max:2, desc:'조준선이 15% 느려진다' },
  brace:    { name:'지지대',    max:1, desc:'무너지는 벽돌 피해가 1개당 2에서 1로' },
  harvest:  { name:'수확',      max:2, desc:'⚔·🛡 벽돌 효과 +1' },
  medkit:   { name:'구급상자',  max:2, desc:'전투에서 이길 때마다 체력 +2' },
};
const rel = id => (RUN && RUN.relics[id]) || 0;
const hitCap = () => 3 + rel('combo');

// ── 도트 리소스
const SPR = {
  knight:[
    "....####....",
    "...######...",
    "...#o##o#...",
    "...######...",
    "....####....",
    "..########.#",
    ".#.######.#.",
    "#..######+..",
    "...######...",
    "...##..##...",
    "...##..##...",
    "..###..###..",
  ],
  slime:[
    "................","................","................","................","................",
    "......####......",
    "....########....",
    "...##########...",
    "..############..",
    "..###o####o###..",
    ".####o####o####.",
    ".##############.",
    "################",
    "################",
    ".##############.",
    "................",
  ],
  bat:[
    "................","................","................","................",
    "##............##",
    "###....##....###",
    "####..####..####",
    "################",
    "#####o####o#####",
    ".##############.",
    "..####.##.####..",
    "...##..##..##...",
    "......####......",
    "......#..#......",
    "................","................",
  ],
  golem:[
    "....########....",
    "...##########...",
    "...##o####o##...",
    "...##########...",
    "....########....",
    ".##############.",
    "################",
    "###.########.###",
    "###.########.###",
    "###.########.###",
    "....########....",
    "....###..###....",
    "....###..###....",
    "...####..####...",
    "...####..####...",
    "................",
  ],
  shroom:[
    "................",
    ".....######.....",
    "...##########...",
    "..###++###++##..",
    ".##############.",
    "####++#####++###",
    "################",
    "..############..",
    ".....######.....",
    ".....#o##o#.....",
    ".....######.....",
    ".....######.....",
    ".....######.....",
    "....########....",
    "................","................",
  ],
  boss:[
    ".#..#..##..#..#.",
    ".##.##.##.##.##.",
    ".##############.",
    "..############..",
    "..##o######o##..",
    "..############..",
    "...##########...",
    ".#.##########.#.",
    "################",
    "#.############.#",
    "#.############.#",
    "...##########...",
    "...###....###...",
    "...###....###...",
    "..####....####..",
    "................",
  ],
};
const ICON = {
  sword: ["......#",".....##","....##.","#.##...",".##....",".##....","#..#..."],
  shield:["#######","#######","#######","#######",".#####.","..###..","...#..."],
  heart: [".##.##.","#######","#######","#######",".#####.","..###..","...#..."],
  skull: [".#####.","#######","#..#..#","#######",".#####.",".#.#.#.","......."],
  brick: ["#######","##.####","#######","####.##","#######",".......","......."],
  up:    ["...#...","..###..",".#####.","#######","..###..","..###..","..###.."],
  dots:  [".......",".......",".......",".#.#.#.",".......",".......","......."],
};
Object.assign(ICON, {
  o_basic:[".......","..###..",".#####.",".#####.",".#####.","..###..","......."],
  o_bomb: ["....#..","...#...","..###..",".#####.",".#####.",".#####.","..###.."],
  o_drill:["...#...","...#...","..###..","..###..",".#####.",".#####.","..###.."],
  o_split:["##...##","##...##",".......","..###..","..###..","..###..","......."],
  o_heavy:[".#####.","#######","#######","#######","#######","#######",".#####."],
});
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
  '+':'000010111010000','-':'000000111000000','/':'001001010100100','x':'000101010101000'
};
function drawText(s, x, y, col, sc = 1, align = 'left'){
  const w = (s.length * 4 - 1) * sc;
  let x0 = align === 'center' ? x - w / 2 : x;
  x0 = Math.round(x0); y = Math.round(y);
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++){
    const f = FONT[s[i]]; if (!f) continue;
    for (let p = 0; p < 15; p++) if (f[p] === '1') ctx.fillRect(x0 + (i * 4 + p % 3) * sc, y + (p / 3 | 0) * sc, sc, sc);
  }
  return w;
}
function drawIcon(name, x, y, col, sc = 1){
  const m = ICON[name]; if (!m) return; ctx.fillStyle = col; x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) if (m[r][c] === '#') ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
}
function drawSprite(map, x, y, sc, main, alt, eye){
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < map.length; r++) for (let c = 0; c < map[r].length; c++){
    const ch = map[r][c]; if (ch === '.') continue;
    ctx.fillStyle = ch === '#' ? main : ch === '+' ? alt : eye;
    ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
  }
}

// ── 저장: 원정 진행(전투 사이 시점)과 최고 기록을 따로 보관
const SAVE_KEY = 'brickquest:run:v2', META_KEY = 'brickquest:meta:v2';
let META = { best:0, runs:0 };
try { const m = JSON.parse(localStorage.getItem(META_KEY)); if (m && typeof m.best === 'number') META = m; } catch(e){}
function saveMeta(){ try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch(e){} }
function saveRun(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(RUN)); } catch(e){} }
function loadRun(){
  try {
    const r = JSON.parse(localStorage.getItem(SAVE_KEY));
    // 구조가 맞지 않는 저장은 버린다(이전 버전 데이터 등)
    if (r && r.v === 2 && Array.isArray(r.deck) && Array.isArray(r.map) && r.map.length === 5) return r;
  } catch(e){}
  return null;
}
function clearRun(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }
const progLabel = p => `${Math.floor((p - 1) / 5) + 1}-${(p - 1) % 5 + 1}`;

// ── 원정 상태
let RUN = null, G = null, mode = 'main', prevMode = null;
function freshRun(){
  return { v:2, s:0, hp:24, maxHp:24, coins:0, deck:['basic','basic','bomb'], relics:{},
           map:genMap(), pos:null, pending:null, path:[], pendingReward:null, shop:null };
}

// ── 갈림길 지도: 3갈래 × 4칸 + 보스. 같은 칸으로는 항상, 옆 칸으로는 40% 확률로 이어진다
const NODE_NAME = { battle:'전투', elite:'정예', rest:'휴식', shop:'상점', boss:'보스' };
function genMap(){
  const pools = [['slime'], ['bat','golem'], ['golem','shroom'], ['shroom','golem','bat']];
  const rows = [];
  for (let r = 0; r < 4; r++){
    const row = [];
    for (let l = 0; l < 3; l++){
      let t = 'battle';
      if (r > 0){
        const w = { battle:45, elite:r === 1 ? 10 : 16, shop:17, rest:r === 3 ? 34 : 18 };
        t = pickW(w);
      }
      const mon = t === 'elite' ? pickOne(['bat','golem','shroom']) : t === 'battle' ? pickOne(pools[r]) : null;
      row.push({ r, l, t, mon, to:[] });
    }
    rows.push(row);
  }
  for (let r = 0; r < 3; r++) for (const n of rows[r]){
    n.to = [n.l];
    if (n.l > 0 && Math.random() < .4) n.to.push(n.l - 1);
    if (n.l < 2 && Math.random() < .4) n.to.push(n.l + 1);
  }
  for (const n of rows[3]) n.to = [1];
  rows.push([{ r:4, l:1, t:'boss', mon:'boss', to:[] }]);
  return rows;
}
const nodeAt = (r, l) => RUN.map[r].find(n => n.l === l);
function reachable(){
  if (!RUN.pos) return RUN.map[0];
  if (RUN.pos.r >= 4) return [];
  const cur = nodeAt(RUN.pos.r, RUN.pos.l);
  return RUN.map[RUN.pos.r + 1].filter(n => cur.to.includes(n.l));
}

// ── 전투 상태
function newBattle(node){
  const cfg = monCfg(node.mon, RUN.s, node.t === 'elite');
  G = {
    node, cfg, time:0, turn:1, phase:'aim', timer:0, eStep:0, cur:null, shown:false,
    p:{ hp:RUN.hp, max:RUN.maxHp, atk:1, def:0, poison:0, flash:0 },   // 공격·방어는 전투마다 초기화
    m:{ hp:cfg.hp, max:cfg.hp, atk:cfg.atk, def:cfg.def, poison:0, pi:0, phase:1, flash:0, lunge:0, dead:false, deadT:0 },
    bricks:[], balls:[], projs:[], pops:[], parts:[], cf:[], queue:[],
    lx:W / 2, nextLx:null, aim:-Math.PI / 2, aimDir:1, aimT:0, fireT:0, fireEl:0, shake:0,
    draw:shuffle(RUN.deck), disc:[], orb:'basic',
  };
  for (let r = WALL.init - 1; r >= 0; r--) spawnRow(r, true);
  drawOrb(); resetAim();
}

function spawnRow(r, instant){
  const rc = G.cfg.row, cells = [];
  for (let c = 0; c < COLS; c++) if (Math.random() < rc.d * WALL.dens) cells.push(c);
  if (!cells.length) cells.push(rnd(COLS));
  // 특수 벽돌은 한 줄에 최대 1개(독은 별도 1개): 드물어야 노려서 맞힐 가치가 생긴다
  const order = shuffle(cells);
  const statCell = Math.random() < rc.stat ? order[0] : -1;
  const poisonCell = rc.poison && order.length > 1 && Math.random() < rc.poison ? order[1] : -1;
  for (const c of cells){
    const type = c === statCell ? pickW(rc.w) : c === poisonCell ? 'poison' : 'n';
    const hp = type === 'n' && Math.random() < rc.hard ? 2 : 1;
    G.bricks.push({ r, c, y: instant ? rowY(r) : rowY(r) - ROWH, hp, type, flash:0, dead:false });
  }
}
function replaceInRow0(n, make){
  const cols = shuffle([...Array(COLS).keys()]).slice(0, n);
  G.bricks = G.bricks.filter(b => !(b.r === 0 && cols.includes(b.c)));
  for (const c of cols) G.bricks.push(Object.assign({ r:0, c, y:rowY(0) - ROWH, flash:0, dead:false }, make()));
}

// 구슬 뽑기: 뽑을 더미가 비면 버린 더미를 섞어 채운다. 다음 구슬을 미리 보여주려고 바로 채워 둔다
function drawOrb(){
  if (!G.draw.length){ G.draw = shuffle(G.disc); G.disc = []; }
  G.orb = G.draw.pop() || 'basic';
  if (!G.draw.length && G.disc.length){ G.draw = shuffle(G.disc); G.disc = []; }
  renderOrbBar();
}
const nextOrb = () => G.draw.length ? G.draw[G.draw.length - 1] : G.orb;

function resetAim(){
  // 매 턴 시작 위치·방향을 무작위로: 같은 타이밍을 외워서 누르는 걸 막는다
  G.aim = AIM_MIN + Math.random() * (AIM_MAX - AIM_MIN);
  G.aimDir = Math.random() < 0.5 ? -1 : 1;
  G.aimT = 0;
}

const intent = () => { const pat = G.m.phase === 2 ? G.cfg.pattern2 : G.cfg.pattern; return pat[G.m.pi % pat.length]; };
const atkVal = it => Math.round(G.m.atk * it.m);
// 방어도는 체력 앞에 붙은 보호막: 피해를 먼저 흡수하고 흡수한 만큼 깎인다
function hurt(t, v){ const ab = Math.min(t.def, v); t.def -= ab; t.hp = Math.max(0, t.hp - (v - ab)); return [ab, v - ab]; }
function hurtPlayer(v, icon, fromMonster){
  const p = G.p, [ab, hit] = hurt(p, v);
  if (ab) pop(PX, 42, '-' + ab, C.ink2, 'shield');
  if (ab && fromMonster && rel('counter') && !G.m.dead)
    G.projs.push({ x0:PX + 10, y0:66, x1:MX, y1:62, t:0, dur:0.3, kind:'dmg', v:ab });
  if (hit){ p.flash = 0.18; G.shake = Math.max(G.shake, 5); burst(PX, 66, C.accent, 10); pop(PX, ab ? 28 : 30, '-' + hit, C.accent, icon); }
  else burst(PX, 66, C.ink3, 6);
}

function pop(x, y, txt, col, icon){ G.pops.push({ x, y, txt, col, icon, t:0.9 }); }
function burst(x, y, col, n){
  for (let k = 0; k < n; k++){
    const a = Math.random() * Math.PI * 2, s = 25 + Math.random() * 55;
    G.parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 20, t:0.35 + Math.random() * 0.3, col });
  }
}
function banner(l1, l2, hot){
  const b = $('banner'); $('bn1').textContent = l1; $('bn2').textContent = l2;
  b.classList.toggle('hot', !!hot); b.classList.add('on');
  clearTimeout(banner.h); banner.h = setTimeout(() => b.classList.remove('on'), 1300);
}

// ── 벽돌 파괴: 성벽은 길만 막고, 강화·독 벽돌은 기사에게 날아간다
function onBreak(b){
  const bx = OX + b.c * CW + CW / 2, by = b.y + BRH / 2;
  if (b.type === 'n' || b.type === 'stone') burst(bx, by, C.ink3, 4);
  else if (b.type === 'poison'){
    G.projs.push({ x0:bx, y0:by, x1:PX, y1:66, t:0, dur:0.36, kind:'poison', v:1 });
    burst(bx, by, C.accent, 7);
  } else {
    G.projs.push({ x0:bx, y0:by, x1:PX, y1:66, t:0, dur:0.36, kind:b.type, v:1 });
    burst(bx, by, C.ink, 5);
  }
}
// 구슬 종류별 파괴 효과
function ballBreak(b, br){
  if (b.kind === 'guard'){ G.p.def += 1; pop(PX + 12, 88, '+1', C.ink2, 'shield'); }
  if (b.kind === 'bomb' && !b.bombed){
    b.bombed = true; G.shake = Math.max(G.shake, 3);
    burst(OX + br.c * CW + CW / 2, br.y + BRH / 2, C.ink, 16);
    for (const o of G.bricks){
      if (o.dead || o === br || Math.abs(o.r - br.r) > 1 || Math.abs(o.c - br.c) > 1) continue;
      o.hp--; o.flash = 0.1;
      if (o.hp <= 0){ o.dead = true; onBreak(o); }
    }
  }
}
function arrive(pr){
  const g = G;
  if (pr.kind === 'dmg'){
    if (g.m.dead) return;
    const [ab, hit] = hurt(g.m, pr.v); g.m.flash = 0.1;
    const jx = MX + (Math.random() * 16 - 8);
    if (ab) pop(jx, 44, '-' + ab, C.ink2, 'shield');
    if (hit) pop(jx, ab ? 32 : 44, '-' + hit, C.ink);
    if (pr.venom){ g.m.poison++; pop(MX + 20, 30, '+1', C.accent, 'skull'); }
    if (g.m.hp === 0) killMonster();
  } else if (pr.kind === 'atk'){ const v = 1 + rel('harvest'); g.p.atk += v; pop(PX - 26, 88, '+' + v, C.ink, 'sword'); }
  else if (pr.kind === 'def'){ const v = 2 + rel('harvest'); g.p.def += v; pop(PX + 12, 88, '+' + v, C.ink, 'shield'); }
  else if (pr.kind === 'heal'){
    const before = g.p.hp; g.p.hp = Math.min(g.p.max, g.p.hp + 4);
    pop(PX, 30, '+' + (g.p.hp - before), C.ink, 'heart');
  } else if (pr.kind === 'poison'){ g.p.poison += pr.v; pop(PX, 30, '+' + pr.v, C.accent, 'skull'); }
}
function killMonster(){
  // 결정타가 들어가면 남은 구슬을 즉시 치워 여운을 몬스터 쓰러짐에 집중시킨다
  G.m.dead = true; G.balls = []; G.queue = []; G.shake = 6;
  burst(MX, 62, C.ink, 26);
}

// ── 구슬 물리
function hitBricks(b){
  for (const br of G.bricks){
    if (br.dead) continue;
    const x = OX + br.c * CW + 1;
    const l = x - 1.5, r = x + CW - 2 + 1.5, t = br.y - 1.5, bo = br.y + BRH + 1.5;
    if (b.x < l || b.x > r || b.y < t || b.y > bo) continue;
    // 송곳 구슬만 뚫고 지나간다. 나머지는 부숴도 튕긴다(한 줄씩 깎아 길을 내야 천장에 닿는다)
    const drilled = b.drill > 0;
    if (drilled){ b.drill--; br.hp = 0; } else br.hp--;
    br.flash = 0.07;
    if (br.hp <= 0){ br.dead = true; onBreak(br); ballBreak(b, br); }
    if (drilled) return;
    const ox = Math.min(b.x - l, r - b.x), oy = Math.min(b.y - t, bo - b.y);
    if (ox < oy){ if (b.x - l < r - b.x){ b.x = l; b.vx = -Math.abs(b.vx); } else { b.x = r; b.vx = Math.abs(b.vx); } }
    else { if (b.y - t < bo - b.y){ b.y = t; b.vy = -Math.abs(b.vy); } else { b.y = bo; b.vy = Math.abs(b.vy); } }
    return;
  }
}
function moveBall(b, dt){
  const n = Math.max(1, Math.ceil(BALL_SPEED * dt / 1.5));
  for (let i = 0; i < n; i++){
    b.x += b.vx * dt / n; b.y += b.vy * dt / n;
    if (b.x < OX + 1.5){ b.x = OX + 1.5; b.vx = Math.abs(b.vx); }
    else if (b.x > RIGHT - 1.5){ b.x = RIGHT - 1.5; b.vx = -Math.abs(b.vx); }
    if (b.y < BT + 1.5){
      b.y = BT + 1.5; b.vy = Math.abs(b.vy);
      // 천장 타격: 성벽을 뚫고 올라온 구슬만 몬스터를 친다
      if (!G.m.dead && b.hits < hitCap()){
        b.hits++;
        const v = G.p.atk * (b.kind === 'heavy' ? 2 : 1);
        G.projs.push({ x0:b.x, y0:BT, x1:MX, y1:62, t:0, dur:0.28, kind:'dmg', v, venom:b.kind === 'venom' });
        G.cf.push({ x:b.x, t:0.25 });
        burst(b.x, BT + 1, C.ink, 6);
      }
    }
    if (Math.abs(b.vy) < BALL_SPEED * 0.12) b.vy = (b.vy < 0 ? -1 : 1) * BALL_SPEED * 0.12;
    hitBricks(b);
    if (b.vy > 0 && b.y >= FLOOR - 2){
      b.done = true;
      if (G.nextLx === null) G.nextLx = clamp(b.x, OX + 4, RIGHT - 4);
      return;
    }
  }
  const v = Math.hypot(b.vx, b.vy) || 1; b.vx = b.vx / v * BALL_SPEED; b.vy = b.vy / v * BALL_SPEED;
}

function fire(){
  const g = G;
  // 턴 시작 직후 0.2초는 무시: 이전 턴에 연타한 입력이 새 턴을 바로 쏘지 않게
  if (mode !== 'play' || !g || g.phase !== 'aim' || g.aimT < 0.2) return;
  g.phase = 'fire'; g.fireT = 1; g.fireEl = 0; g.nextLx = null;
  g.queue = g.orb === 'split' ? [g.aim - 0.16, g.aim, g.aim + 0.16].map(a => clamp(a, AIM_MIN, AIM_MAX)) : [g.aim];
}

// ── 턴 진행
function update(dt){
  const g = G;
  g.time += dt;
  g.m.flash = Math.max(0, g.m.flash - dt); g.p.flash = Math.max(0, g.p.flash - dt);
  g.shake = Math.max(0, g.shake - dt * 20);
  if (g.m.lunge > 0){ g.m.lunge += dt; if (g.m.lunge > 0.4) g.m.lunge = 0; }
  if (g.m.dead) g.m.deadT += dt;
  for (const b of g.bricks){ b.y += (rowY(b.r) - b.y) * Math.min(1, dt * 12); if (b.flash > 0) b.flash -= dt; }
  g.bricks = g.bricks.filter(b => !b.dead);
  for (const pr of g.projs){ pr.t += dt; if (pr.t >= pr.dur && !pr.hit){ pr.hit = true; arrive(pr); } }
  g.projs = g.projs.filter(p => !p.hit);
  for (const p of g.pops){ p.y -= 14 * dt; p.t -= dt; }
  g.pops = g.pops.filter(p => p.t > 0);
  for (const p of g.parts){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.t -= dt; }
  g.parts = g.parts.filter(p => p.t > 0);
  for (const f of g.cf) f.t -= dt;
  g.cf = g.cf.filter(f => f.t > 0);

  if (g.phase === 'aim'){
    // 조준선은 일정 속도로 좌우를 왕복한다(삼각파). 가장자리에서 느려지지 않아야 타이밍이 공정하다
    g.aimT += dt;
    g.aim += g.aimDir * g.cfg.sweep * Math.pow(0.85, rel('focus')) * dt;
    if (g.aim > AIM_MAX){ g.aim = 2 * AIM_MAX - g.aim; g.aimDir = -1; }
    if (g.aim < AIM_MIN){ g.aim = 2 * AIM_MIN - g.aim; g.aimDir = 1; }
  } else if (g.phase === 'fire'){
    g.fireT += dt; g.fireEl += dt;
    if (g.queue.length && g.fireT >= 0.07){
      g.fireT = 0;
      const a = g.queue.shift();
      g.balls.push({ x:g.lx, y:FLOOR - 2, vx:Math.cos(a) * BALL_SPEED, vy:Math.sin(a) * BALL_SPEED,
                     hits:0, kind:g.orb, drill:g.orb === 'drill' ? 3 : 0, bombed:false });
    }
    // 오래 도는 구슬은 점점 빨리 감고, 25초가 넘으면 갇힌 것으로 보고 회수한다
    const ts = g.fireEl > 10 ? 3 : g.fireEl > 5 ? 2 : 1;
    if (g.fireEl > 25 && g.balls.length){
      if (g.nextLx === null) g.nextLx = clamp(g.balls[0].x, OX + 4, RIGHT - 4);
      g.balls = [];
    }
    for (const b of g.balls) moveBall(b, dt * ts);
    g.balls = g.balls.filter(b => !b.done);
    if (!g.queue.length && !g.balls.length && !g.projs.length) endPlayerTurn();
  } else if (g.phase === 'enemy'){
    enemyUpdate(dt);
  } else if (g.phase === 'win' || g.phase === 'lose'){
    g.timer += dt;
    if (!g.shown && g.timer > (g.phase === 'win' ? 1.1 : 0.8)){ g.shown = true; battleEnd(g.phase === 'win'); }
  }
}

function endPlayerTurn(){
  const g = G, m = g.m;
  if (g.nextLx !== null) g.lx = g.nextLx;
  g.nextLx = null;
  if (m.dead){ g.phase = 'win'; g.timer = 0; return; }
  if (g.p.hp <= 0){ g.phase = 'lose'; g.timer = 0; return; }
  g.phase = 'enemy'; g.timer = 0; g.eStep = 0;
  // 몬스터 독: 몬스터가 행동하기 직전에 방어도를 무시하고 들어간다
  if (m.poison > 0){
    const d = m.poison;
    m.hp = Math.max(0, m.hp - d); m.poison--; m.flash = 0.15;
    burst(MX, 62, C.accent, 8); pop(MX, 30, '-' + d, C.accent, 'skull');
    if (m.hp === 0){ killMonster(); g.phase = 'win'; g.timer = 0; return; }
    g.timer = -0.4;
  }
}

function enemyUpdate(dt){
  const g = G, m = g.m, p = g.p;
  g.timer += dt;
  if (g.timer < 0) return;
  if (g.eStep === 0){
    g.eStep = 1; g.cur = intent();
    const it = g.cur;
    if (it.t === 'atk' || it.t === 'poison') m.lunge = 0.001;
    else if (it.t === 'guard'){ m.def += it.v; pop(MX, 30, '+' + it.v, C.ink, 'shield'); }
    else if (it.t === 'charge') pop(MX, 30, '', C.ink, 'up');
    else if (it.t === 'spore') pop(MX, 30, '', C.accent, 'brick');
    else if (it.t === 'summon') pop(MX, 30, '', C.ink, 'brick');
    else pop(MX, 30, '', C.ink3, 'dots');
  }
  if (g.eStep === 1 && g.timer >= 0.2){
    g.eStep = 2;
    if (g.cur.t === 'atk') hurtPlayer(atkVal(g.cur), undefined, true);
    else if (g.cur.t === 'poison'){ p.poison += g.cur.v; burst(PX, 66, C.accent, 8); pop(PX, 30, '+' + g.cur.v, C.accent, 'skull'); }
  }
  if (g.eStep === 2 && g.timer >= 0.6){
    g.eStep = 3;
    // 성벽은 몇 턴마다 한 번 내려온다: 구슬이 튕기는 구조라 매 턴 내려오면 길을 낼 틈이 없다
    if (g.turn % WALL.every === 0 || g.cur.t === 'summon' || g.cur.t === 'spore'){
      for (const b of g.bricks) b.r++;
      spawnRow(0, false);
    }
    if (g.cur.t === 'summon') replaceInRow0(3, () => ({ type:'stone', hp:3 + m.phase }));
    if (g.cur.t === 'spore') replaceInRow0(2, () => ({ type:'poison', hp:1 }));
    // 붕괴선을 넘은 벽돌은 무너지며 기사를 덮친다
    const hits = g.bricks.filter(b => b.r >= MAXROW);
    if (hits.length){
      for (const b of hits){ b.dead = true; burst(OX + b.c * CW + CW / 2, rowY(b.r) + 6, C.accent, 6); }
      hurtPlayer(hits.length * (rel('brace') ? 1 : 2), 'brick'); g.shake = 6;
    }
  }
  if (g.eStep === 3 && g.timer >= 0.95){
    g.eStep = 4; g.tickT = 0;
    // 독 틱: 방어도를 무시하고 체력에 바로 들어간 뒤 약해진다
    if (p.poison > 0){
      const d = p.poison;
      p.hp = Math.max(0, p.hp - d); p.poison = Math.max(0, p.poison - (rel('antidote') ? 2 : 1)); p.flash = 0.18;
      burst(PX, 66, C.accent, 8); pop(PX, 30, '-' + d, C.accent, 'skull');
      g.tickT = 0.45;
    }
  }
  if (g.eStep === 4 && g.timer >= 0.95 + g.tickT){
    g.eStep = 5; m.pi++;
    if (g.cfg.boss && m.phase === 1 && m.hp <= m.max / 2){
      m.phase = 2; m.pi = 0; m.atk += 1; m.def += 2; g.shake = 8;
      banner('보스가 분노했다', '2페이즈', true);
    }
    if (p.hp <= 0){ g.phase = 'lose'; g.timer = 0; return; }
    g.disc.push(g.orb); drawOrb();
    g.phase = 'aim'; g.turn++; g.cur = null; resetAim();
  }
}

// ── 렌더
function statRow(cx, atk, def){
  drawIcon('sword', cx - 36, 94, C.ink); drawText(String(atk), cx - 27, 93, C.ink, 2);
  drawIcon('shield', cx + 2, 94, C.ink); drawText(String(def), cx + 11, 93, C.ink, 2);
}
function hpBlock(cx, hp, max, danger, poison){
  drawIcon('heart', cx - 36, 5, danger ? C.accent : C.ink);
  drawText(String(hp), cx - 27, 4, danger ? C.accent : C.ink, 2);
  ctx.fillStyle = C.line; ctx.fillRect(cx - 36, 17, 72, 4);
  const hw = Math.round(72 * hp / max);
  ctx.fillStyle = danger ? C.accent : C.ink; ctx.fillRect(cx - 36, 17, hw, 4);
  if (poison > 0){
    // 다음 독 틱으로 사라질 체력 구간을 붉게 미리 보여준다
    const pw = Math.round(72 * Math.min(poison, hp) / max);
    ctx.fillStyle = C.accent; ctx.fillRect(cx - 36 + hw - pw, 17, pw, 4);
    drawIcon('skull', cx + 12, 5, C.accent); drawText(String(poison), cx + 21, 4, C.accent, 2);
  }
}
function brickAt(x, y){
  for (const b of G.bricks){
    const bx = OX + b.c * CW + 1;
    if (x >= bx - 1.5 && x <= bx + CW - 2 + 1.5 && y >= b.y - 1.5 && y <= b.y + BRH + 1.5) return true;
  }
  return false;
}
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, BT);
  ctx.fillStyle = C.field; ctx.fillRect(0, BT, W, H - BT);
  const g = G; if (!g) return;
  const sx = g.shake > 0 ? Math.round((Math.random() - .5) * g.shake) : 0;
  const sy = g.shake > 0 ? Math.round((Math.random() - .5) * g.shake) : 0;
  ctx.setTransform(1, 0, 0, 1, sx, sy);

  const p = g.p, m = g.m;
  hpBlock(PX, p.hp, p.max, p.hp <= p.max * 0.3, p.poison);
  statRow(PX, p.atk, p.def);
  drawSprite(SPR.knight, PX - 18, 50, 3, p.flash > 0 ? C.accent : C.ink, C.ink2, C.bg);

  const angry = g.cfg.boss && m.phase === 2;
  if (!m.dead || Math.floor(m.deadT * 10) % 2 === 0){
    hpBlock(MX, m.hp, m.max, false, m.poison);
    statRow(MX, m.atk, m.def);
    const lunge = m.lunge > 0 ? -Math.sin(Math.PI * m.lunge / 0.4) * 14 : 0;
    const sink = m.dead ? Math.min(20, m.deadT * 30) : 0;
    ctx.globalAlpha = m.dead ? Math.max(0, 1 - m.deadT) : 1;
    drawSprite(SPR[g.cfg.spr], MX - 24 + lunge, 38 + sink, 3, m.flash > 0 ? C.ink3 : C.ink, C.ink2, (angry || g.cfg.elite) ? C.accent : C.bg);
    ctx.globalAlpha = 1;
  }
  // 몬스터의 다음 행동 예고: 이것만 보고 이번 턴에 무엇을 노릴지 정한다
  if (!m.dead && (g.phase === 'aim' || g.phase === 'fire')){
    const it = intent();
    if (it.t === 'atk'){ drawIcon('sword', MX - 14, 27, C.accent); drawText(String(atkVal(it)), MX - 4, 25, C.accent, 2); }
    else if (it.t === 'guard'){ drawIcon('shield', MX - 14, 27, C.ink); drawText('+' + it.v, MX - 4, 25, C.ink, 2); }
    else if (it.t === 'charge') drawIcon('up', MX - 4, 27, C.ink);
    else if (it.t === 'spore') drawIcon('brick', MX - 4, 27, C.accent);
    else if (it.t === 'poison'){ drawIcon('skull', MX - 14, 27, C.accent); drawText('+' + it.v, MX - 4, 25, C.accent, 2); }
    else if (it.t === 'summon') drawIcon('brick', MX - 4, 27, C.ink);
    else drawIcon('dots', MX - 4, 27, C.ink3);
  }

  // 천장: 이 선에 닿아야 몬스터를 친다
  ctx.fillStyle = C.ink; ctx.fillRect(0, BT - 2, W, 2);
  for (const f of g.cf){ ctx.globalAlpha = clamp(f.t * 4, 0, 1); ctx.fillRect(Math.round(f.x) - 7, BT - 5, 14, 3); }
  ctx.globalAlpha = 1;

  for (const b of g.bricks){
    const x = OX + b.c * CW + 1, y = Math.round(b.y), w = CW - 2, h = BRH;
    if (b.type === 'n' || b.type === 'stone'){
      let fill = b.type === 'stone' ? C.ink : b.hp >= 3 ? C.ink : b.hp === 2 ? C.ink2 : C.ink3;
      if (b.flash > 0) fill = C.line;
      ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
      if (b.type === 'stone'){ ctx.fillStyle = C.field; for (let k = 2; k < w; k += 4) ctx.fillRect(x + k, y + 1, 1, 1); }
      if (b.hp > 1) drawText(String(b.hp), x + w / 2, y + 4, C.field, 1, 'center');
    } else {
      const border = b.type === 'poison' ? C.accent : C.ink;
      ctx.fillStyle = b.flash > 0 ? C.line : C.panel; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = border;
      ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
      const ic = b.type === 'atk' ? 'sword' : b.type === 'def' ? 'shield' : b.type === 'heal' ? 'heart' : 'skull';
      drawIcon(ic, x + 7.5, y + 2.5, border);
    }
  }

  // 붕괴선: 이 선을 넘는 벽돌은 무너지며 기사를 덮친다
  const lowR = g.bricks.reduce((a, b) => Math.max(a, b.r), 0);
  ctx.fillStyle = lowR >= MAXROW - 2 && Math.floor(g.time * 5) % 2 === 0 ? C.accent : C.ink3;
  for (let x = OX; x < RIGHT; x += 4) ctx.fillRect(x, CRASH_Y, 2, 1);
  ctx.fillStyle = C.line;
  for (let x = OX; x < RIGHT; x += 4) ctx.fillRect(x, FLOOR, 2, 1);

  if (g.phase === 'aim' && mode === 'play'){
    const dx = Math.cos(g.aim), dy = Math.sin(g.aim);
    let x = g.lx, y = FLOOR - 2, len = 0;
    for (let k = 0; k < 400; k++){
      x += dx * 1.5; y += dy * 1.5; len += 1.5;
      if (x < OX + 1.5 || x > RIGHT - 1.5 || y < BT + 1.5 || brickAt(x, y)) break;
    }
    ctx.fillStyle = C.ink2;
    for (let d = 10; d < len; d += 6) ctx.fillRect(Math.round(g.lx + dx * d), Math.round(FLOOR - 2 + dy * d), 1, 1);
    ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 1); ctx.fillRect(Math.round(x) - 1, Math.round(y) + 1, 3, 1);
  }

  // 발사대: 이번에 쏠 구슬의 아이콘을 보여준다
  if (g.phase === 'aim' || (g.phase === 'fire' && g.queue.length)) drawIcon(ORBS[g.orb].icon, g.lx - 3, FLOOR - 8, C.ink);
  if (g.nextLx !== null){ ctx.fillStyle = C.ink2; ctx.fillRect(Math.round(g.nextLx) - 1, FLOOR - 3, 3, 3); }
  ctx.fillStyle = C.ink;
  for (const b of g.balls){
    const s = b.kind === 'heavy' ? 4 : 3;
    ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, s, s);
  }

  for (const pr of g.projs){
    const k = clamp(pr.t / pr.dur, 0, 1), e = k * k;
    const x = pr.x0 + (pr.x1 - pr.x0) * e, y = pr.y0 + (pr.y1 - pr.y0) * k - Math.sin(Math.PI * k) * 18;
    if (pr.kind === 'dmg'){ ctx.fillStyle = pr.venom ? C.accent : C.ink; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3); }
    else if (pr.kind === 'poison') drawIcon('skull', x - 3, y - 3, C.accent);
    else drawIcon(pr.kind === 'atk' ? 'sword' : pr.kind === 'def' ? 'shield' : 'heart', x - 3, y - 3, C.ink);
  }
  for (const q of g.parts){ ctx.globalAlpha = clamp(q.t * 2.5, 0, 1); ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); }
  for (const pp of g.pops){
    ctx.globalAlpha = clamp(pp.t * 1.8, 0, 1);
    const tw = pp.txt ? (pp.txt.length * 4 - 1) * 2 : 0, iw = pp.icon ? 9 : 0, x0 = pp.x - (tw + iw) / 2;
    if (pp.icon) drawIcon(pp.icon, x0, pp.y + 1, pp.col);
    if (pp.txt) drawText(pp.txt, x0 + iw, pp.y, pp.col, 2);
  }
  ctx.globalAlpha = 1;
}

// ── HUD
function setHeader(stage, name){ $('hStage').textContent = stage; $('hName').textContent = name; }
function renderCoins(){ $('hCoin').textContent = RUN && mode !== 'main' ? `코인 ${RUN.coins}` : ''; }
function deckSummary(){
  const cnt = {}; RUN.deck.forEach(o => cnt[o] = (cnt[o] || 0) + 1);
  return Object.keys(cnt).map(o => `${ORBS[o].name.replace(' 구슬', '')} ${cnt[o]}`).join(', ');
}
function renderOrbBar(){
  const el = $('orbBar'); el.textContent = '';
  if (!RUN || mode === 'main') return;
  if (G && mode === 'play'){
    const b1 = document.createElement('b'); b1.textContent = ORBS[G.orb].name;
    el.append('이번 ', b1, `  →  다음 ${ORBS[nextOrb()].name}`);
    el.title = ORBS[G.orb].desc;
  } else el.append(`구슬 덱 ${RUN.deck.length}개: ${deckSummary()}`);
}
function renderAbil(){
  const box = $('abil'); box.textContent = '';
  if (!RUN || mode === 'main') return;
  const ids = Object.keys(RUN.relics);
  if (!ids.length){ const n = document.createElement('span'); n.className = 'none'; n.textContent = '유물 없음'; box.append(n); return; }
  for (const id of ids){
    const c = document.createElement('span');
    c.textContent = RELICS[id].name + (RUN.relics[id] > 1 ? ' ' + RUN.relics[id] : '');
    c.title = RELICS[id].desc;
    box.append(c);
  }
}
function refreshHud(){ renderCoins(); renderOrbBar(); renderAbil(); }

// ── 화면 전환 공통
const OVERLAYS = ['ovMain','ovMap','ovChoose','ovPause'];
function show(id){ OVERLAYS.forEach(o => $(o).classList.toggle('on', o === id)); }
function setMode(m, overlay){ mode = m; show(overlay); refreshHud(); }

// 선택 화면(보상·휴식·상점·덜어내기)을 하나의 틀로 그린다
function showChoice(o){
  $('cTitle').textContent = o.title; $('cTitle').className = 'big';
  $('cSub').textContent = o.sub || '';
  const box = $('cCards'); box.textContent = '';
  for (const c of o.cards){
    const b = document.createElement('button');
    b.className = 'rCard' + (c.rare ? ' rare' : ''); b.disabled = !!c.disabled;
    const t = document.createElement('b'); t.append(c.name);
    if (c.tag){ const em = document.createElement('em'); em.textContent = c.tag; t.append(em); }
    const d = document.createElement('span'); d.textContent = c.desc;
    b.append(t, d);
    b.onclick = () => { if (mode !== o.mode) return; c.onPick(); };
    box.append(b);
  }
  const row = $('cBtns'); row.textContent = '';
  for (const bt of (o.buttons || [])){
    const b = document.createElement('button');
    b.className = 'btn' + (bt.primary ? ' primary' : ''); b.textContent = bt.label; b.disabled = !!bt.disabled;
    b.onclick = () => { if (mode !== o.mode) return; bt.onClick(); };
    row.append(b);
  }
  setMode(o.mode, 'ovChoose');
  const first = box.querySelector('button:not(:disabled)') || row.querySelector('button'); if (first) first.focus();
}

// ── 메인 화면
function showMain(){
  G = null;
  const saved = loadRun();
  RUN = saved || freshRun();           // 배경 장면용. 저장은 하지 않는다
  newBattle({ r:0, l:0, t:'battle', mon:'slime' });
  const c = $('mContinue');
  c.hidden = !saved;
  if (saved){
    const where = saved.pending ? saved.pending : saved.pos;
    const step = where ? `${saved.s + 1}-${where.r + 1}` : `${saved.s + 1}-출발`;
    c.textContent = '이어하기';
    const sm = document.createElement('small'); sm.textContent = `${step}, 체력 ${saved.hp}/${saved.maxHp}, 구슬 ${saved.deck.length}개`;
    c.append(sm);
  }
  $('mNew').textContent = '새 원정'; $('mNew').dataset.arm = '';
  $('mRecord').textContent = META.best > 0 ? `최고 기록 ${progLabel(META.best)} 돌파, 원정 ${META.runs}회` : '';
  setHeader('', '');
  setMode('main', 'ovMain');
  (saved ? c : $('mNew')).focus();
}
$('mContinue').onclick = () => { const r = loadRun(); if (!r) return showMain(); RUN = r; resumeRun(); };
// 저장된 원정이 있으면 두 번 눌러야 덮어쓴다
$('mNew').onclick = e => {
  const b = e.currentTarget;
  if (loadRun() && !b.dataset.arm){ b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 저장된 원정이 사라진다'; return; }
  RUN = freshRun(); META.runs++; saveMeta(); saveRun(); showMap();
};
function resumeRun(){
  if (RUN.pendingReward) return showReward(RUN.pendingReward);
  if (RUN.pending) return enterNode(nodeAt(RUN.pending.r, RUN.pending.l));
  showMap();
}

// ── 지도
const LANE_X = [18, 50, 82], ROW_Y = [88, 69, 50, 31, 11];
const nodeX = n => n.t === 'boss' ? 50 : LANE_X[n.l];
function showMap(){
  G = null;
  $('mapTitle').textContent = `세션 ${RUN.s + 1}`;
  $('mapSub').textContent = `체력 ${RUN.hp}/${RUN.maxHp}  코인 ${RUN.coins}`;
  const box = $('mapBox'); box.textContent = '';
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('preserveAspectRatio', 'none'); svg.setAttribute('aria-hidden', 'true');
  const onPath = (a, b) => RUN.path.some((p, i) => i > 0 && RUN.path[i - 1][0] === a.r && RUN.path[i - 1][1] === a.l && p[0] === b.r && p[1] === b.l);
  for (let r = 0; r < 4; r++) for (const n of RUN.map[r]) for (const l of n.to){
    const m = r === 3 ? RUN.map[4][0] : nodeAt(r + 1, l);
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', nodeX(n)); ln.setAttribute('y1', ROW_Y[r]); ln.setAttribute('x2', nodeX(m)); ln.setAttribute('y2', ROW_Y[r + 1]);
    const walked = onPath(n, m);
    ln.setAttribute('stroke', walked ? C.ink : C.ink3);
    ln.setAttribute('stroke-width', walked ? 3 : 1.5);
    if (!walked) ln.setAttribute('stroke-dasharray', '3 3');
    ln.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.append(ln);
  }
  box.append(svg);
  const reach = reachable();
  const visited = (r, l) => RUN.path.some(p => p[0] === r && p[1] === l);
  for (const row of RUN.map) for (const n of row){
    const b = document.createElement('button');
    const canGo = reach.includes(n);
    b.className = 'node' + (n.t === 'boss' ? ' boss' : '') + (canGo ? ' reach' : '') + (visited(n.r, n.l) ? ' done' : '');
    b.style.left = nodeX(n) + '%'; b.style.top = ROW_Y[n.r] + '%';
    b.textContent = NODE_NAME[n.t];
    b.setAttribute('aria-label', `${n.r + 1}번째 칸 ${NODE_NAME[n.t]}${canGo ? ', 갈 수 있음' : ''}`);
    b.disabled = !canGo;
    b.onclick = () => { if (mode === 'map' && canGo) enterNode(n); };
    box.append(b);
  }
  setHeader(`세션 ${RUN.s + 1}`, '갈림길');
  setMode('map', 'ovMap');
  const first = box.querySelector('.node.reach'); if (first) first.focus();
}

function enterNode(n){
  RUN.pending = { r:n.r, l:n.l }; saveRun();
  if (n.t === 'rest') return showRest();
  if (n.t === 'shop') return showShop();
  startBattle(n);
}
function completeNode(){
  const n = RUN.pending; if (!n) return;
  RUN.pos = { r:n.r, l:n.l }; RUN.path.push([n.r, n.l]); RUN.pending = null;
  META.best = Math.max(META.best, RUN.s * 5 + n.r + 1); saveMeta();
}
function finishNonBattle(){ completeNode(); RUN.shop = null; saveRun(); showMap(); }

// ── 전투 시작·종료
function startBattle(n){
  newBattle(n);
  const label = `${RUN.s + 1}-${n.r + 1}`;
  setHeader(`세션 ${RUN.s + 1}  ${label} ${NODE_NAME[n.t]}`, G.cfg.name);
  setMode('play', null);
  banner(n.t === 'boss' ? `세션 ${RUN.s + 1} 보스` : label, G.cfg.name, n.t !== 'battle');
}
function battleEnd(win){
  const n = G.node;
  if (!win) return runOver();
  RUN.hp = Math.min(RUN.maxHp, G.p.hp + 2 * rel('medkit'));
  const gain = n.t === 'boss' ? 40 : n.t === 'elite' ? 22 + rnd(7) : 10 + rnd(5);
  RUN.coins += gain; RUN.lastGain = gain;
  if (n.t === 'boss') RUN.hp = Math.min(RUN.maxHp, RUN.hp + Math.ceil(RUN.maxHp / 2));   // 세션 돌파: 절반 회복
  completeNode();
  RUN.pendingReward = n.t === 'battle' ? 'orb' : n.t;
  saveRun();
  showReward(RUN.pendingReward);
}
function runOver(){
  const n = G.node; clearRun();
  showChoice({
    mode:'result', title:'원정 실패',
    sub:`${RUN.s + 1}-${n.r + 1}, ${G.cfg.name}에게 쓰러졌다. 구슬 ${RUN.deck.length}개, 유물 ${Object.keys(RUN.relics).length}개를 모았다.`,
    cards:[], buttons:[
      { label:'새 원정', primary:true, onClick:() => { RUN = freshRun(); META.runs++; saveMeta(); saveRun(); showMap(); } },
      { label:'메인 화면', onClick:showMain },
    ],
  });
  $('cTitle').className = 'big lose';
}

// ── 보상
function rollOrbs(){
  const pool = Object.keys(ORBS).filter(k => ORBS[k].rar > 0), out = [];
  while (out.length < 3 && pool.length){
    const w = {}; pool.forEach(k => w[k] = ORBS[k].rar === 1 ? 10 : 5);
    const k = pickW(w); out.push(k); pool.splice(pool.indexOf(k), 1);
  }
  return out;
}
function rollRelics(n){
  const pool = Object.keys(RELICS).filter(k => rel(k) < RELICS[k].max);
  return shuffle(pool).slice(0, n);
}
let rerollLeft = 1, rewardStock = null;
function showReward(kind){
  rerollLeft = 1;
  rewardStock = kind === 'orb' ? rollOrbs() : rollRelics(3);
  renderReward(kind);
}
function renderReward(kind){
  const isOrb = kind === 'orb';
  const head = kind === 'boss' ? `세션 ${RUN.s + 1} 돌파! 체력 절반 회복, 코인 +${RUN.lastGain || 0}.` : `승리! 코인 +${RUN.lastGain || 0}.`;
  const cards = rewardStock.map(id => isOrb
    ? { name:ORBS[id].name, desc:ORBS[id].desc, rare:ORBS[id].rar === 2, onPick:() => takeReward(() => RUN.deck.push(id), kind) }
    : { name:RELICS[id].name + (rel(id) ? ` ${rel(id) + 1}단계` : ''), desc:RELICS[id].desc, onPick:() => takeReward(() => RUN.relics[id] = rel(id) + 1, kind) });
  const buttons = [{ label:rerollLeft ? '다시 뽑기 (1회)' : '다시 뽑기 (사용함)', disabled:!rerollLeft || !cards.length,
                     onClick:() => { rerollLeft--; rewardStock = isOrb ? rollOrbs() : rollRelics(3); renderReward(kind); } }];
  // 구슬은 안 받는 것도 전략이다: 덱이 얇을수록 좋은 구슬이 자주 나온다
  if (isOrb || !cards.length) buttons.push({ label:'건너뛰기', onClick:() => takeReward(() => {}, kind) });
  showChoice({ mode:'reward', title:isOrb ? '구슬 하나를 덱에 넣는다' : '유물 하나를 고른다',
               sub:head + (isOrb ? ` 지금 덱: ${deckSummary()}` : ''), cards, buttons });
}
function takeReward(apply, kind){
  apply(); RUN.pendingReward = null;
  if (kind === 'boss'){ RUN.s++; RUN.map = genMap(); RUN.pos = null; RUN.path = []; }
  saveRun(); showMap();
}

// ── 휴식
function showRest(){
  const amt = Math.ceil(RUN.maxHp * 0.4);
  setHeader(`세션 ${RUN.s + 1}`, '휴식');
  showChoice({ mode:'rest', title:'모닥불', sub:`체력 ${RUN.hp}/${RUN.maxHp}. 하나만 할 수 있다.`, cards:[
    { name:'쉬기', desc:`체력 ${amt} 회복`, disabled:RUN.hp >= RUN.maxHp,
      onPick:() => { RUN.hp = Math.min(RUN.maxHp, RUN.hp + amt); finishNonBattle(); } },
    { name:'덜어내기', desc:'구슬 1개를 덱에서 뺀다. 좋은 구슬이 더 자주 나온다', disabled:RUN.deck.length <= 2,
      onPick:() => showRemove(finishNonBattle, () => showRest()) },
  ], buttons:[{ label:'그냥 지나간다', onClick:finishNonBattle }] });
}
function showRemove(done, back){
  const cnt = {}; RUN.deck.forEach(o => cnt[o] = (cnt[o] || 0) + 1);
  showChoice({ mode:'remove', title:'뺄 구슬을 고른다', sub:`지금 덱 ${RUN.deck.length}개`,
    cards:Object.keys(cnt).map(o => ({ name:ORBS[o].name, tag:`${cnt[o]}개`, desc:ORBS[o].desc,
      onPick:() => { RUN.deck.splice(RUN.deck.indexOf(o), 1); done(); } })),
    buttons:[{ label:'취소', onClick:back }] });
}

// ── 상점: 들어갈 때 물건을 정해 저장해 둔다(새로고침으로 물건을 바꾸지 못하게)
function showShop(){
  if (!RUN.shop){
    const orbs = rollOrbs().slice(0, 2), relic = rollRelics(1)[0];
    RUN.shop = [
      ...orbs.map(id => ({ k:'orb', id, price:ORBS[id].rar === 1 ? 20 : 32 })),
      ...(relic ? [{ k:'relic', id:relic, price:45 }] : []),
      { k:'heal', price:15 }, { k:'remove', price:25 },
    ];
    saveRun();
  }
  setHeader(`세션 ${RUN.s + 1}`, '상점');
  const cards = RUN.shop.map((it, i) => {
    const poor = RUN.coins < it.price, tag = it.sold ? '판매됨' : `${it.price}코인`;
    const buy = after => { RUN.coins -= it.price; it.sold = true; after(); saveRun(); showShop(); };
    if (it.k === 'orb') return { name:ORBS[it.id].name, tag, desc:ORBS[it.id].desc, rare:ORBS[it.id].rar === 2,
      disabled:it.sold || poor, onPick:() => buy(() => RUN.deck.push(it.id)) };
    if (it.k === 'relic') return { name:RELICS[it.id].name, tag, desc:RELICS[it.id].desc,
      disabled:it.sold || poor, onPick:() => buy(() => RUN.relics[it.id] = rel(it.id) + 1) };
    if (it.k === 'heal') return { name:'약초', tag, desc:`체력 8 회복 (지금 ${RUN.hp}/${RUN.maxHp})`,
      disabled:it.sold || poor || RUN.hp >= RUN.maxHp, onPick:() => buy(() => RUN.hp = Math.min(RUN.maxHp, RUN.hp + 8)) };
    return { name:'구슬 덜어내기', tag, desc:'구슬 1개를 덱에서 뺀다',
      disabled:it.sold || poor || RUN.deck.length <= 2,
      onPick:() => showRemove(() => { RUN.coins -= it.price; it.sold = true; saveRun(); showShop(); }, showShop) };
  });
  showChoice({ mode:'shop', title:'상점', sub:`코인 ${RUN.coins}`, cards, buttons:[{ label:'나가기', primary:true, onClick:finishNonBattle }] });
}

// ── 메뉴(일시정지)
function openMenu(){
  if (mode === 'main' || mode === 'pause' || mode === 'result') return;
  prevMode = mode; mode = 'pause';
  $('pMainSub').textContent = prevMode === 'play' ? '이번 전투는 처음부터 다시 시작된다' : '진행은 저장되어 있다';
  $('pGiveup').textContent = '원정 포기'; $('pGiveup').dataset.arm = '';
  $('ovPause').classList.add('on'); $('pResume').focus();
}
function closeMenu(){ if (mode !== 'pause') return; $('ovPause').classList.remove('on'); mode = prevMode; }
$('btnMenu').onclick = () => mode === 'pause' ? closeMenu() : openMenu();
$('pResume').onclick = closeMenu;
$('pMain').onclick = () => { $('ovPause').classList.remove('on'); showMain(); };
$('pGiveup').onclick = e => {
  const b = e.currentTarget;
  if (!b.dataset.arm){ b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 원정이 끝난다'; return; }
  $('ovPause').classList.remove('on'); clearRun(); showMain();
};
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') openMenu(); });

// ── 입력: 조준선은 스스로 움직이고, 플레이어는 타이밍에 맞춰 누르기만 한다
cv.addEventListener('pointerdown', e => { if (mode === 'play'){ e.preventDefault(); fire(); } });
addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ mode === 'pause' ? closeMenu() : openMenu(); return; }
  if (mode === 'play' && (e.key === ' ' || e.key === 'Enter')){ if (!e.repeat) fire(); e.preventDefault(); }
});

// ── 메인 루프
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && mode === 'play') update(dt);
  draw();
  if (G && mode === 'play') $('hCoin').textContent = `코인 ${RUN.coins}  ${G.turn}턴`;
  requestAnimationFrame(frame);
}
showMain();
requestAnimationFrame(frame);
})();
</script>
