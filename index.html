<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브릭 크롤</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFE8DA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D1B18">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 세로 고정 게임: 가로로 눕힌 폰에서만 보인다(css/style.css "세로 고정") -->
<div class="rotateHint" role="alert" aria-live="assertive"><div class="ri" aria-hidden="true"></div><b>기기를 세로로 세워 주세요</b><span>접속은 그 자리에서 멈춰 기다린다</span></div>
<div class="app" id="app">
  <div class="brandStrip"><span>BRICK / CRAWL</span><span>구슬로 내려가는 협곡</span></div>
  <header class="hud">
    <div>
      <div class="hStage" id="hStage"></div>
      <div class="hName" id="hName">브릭 크롤</div>
    </div>
    <div class="hRight">
      <span class="hCoin" id="hCoin"></span>
      <button class="iconBtn" id="btnMenu" aria-label="일시정지">II</button>
    </div>
  </header>
  <!-- 무전 띠는 구슬 줄 위에 겹쳐 뜬다: 전투판(천장·버그 예고)을 가리지 않고 판도 밀어내지 않게 -->
  <div class="hudRows">
    <div class="orbBar" id="orbBar"></div>
    <div class="abil" id="abil" aria-label="보유 칩"></div>
    <div class="radio" id="radio" role="status" aria-live="polite" hidden></div>
  </div>

  <div class="stageWrap"><div class="stage">
    <canvas id="cv" aria-label="위는 전투 화면, 아래는 벽돌판"></canvas>
    <div class="banner" id="banner"><div class="b1" id="bn1"></div><div class="b2" id="bn2"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="ov on ovMain" id="ovMain">
      <canvas class="logoCv" id="logoCv" role="img" aria-label="BRICK CRAWL"></canvas>
      <div class="logo">브릭 크롤</div>
      <div class="orbShowcase" id="orbShowcase" aria-hidden="true"></div>
      <p class="tagline">데이터 벽을 깨고, 버그를 튕겨라.</p>
      <div class="whoRow"><div class="who"><span class="whoLbl">호출명</span><b id="mName"></b></div><button class="renameBtn" id="mRename" aria-label="호출명 변경">변경</button></div>
      <form class="renameForm" id="renameForm" hidden>
        <label for="nameIn">새 호출명 (한글·영문·숫자 2~12자, 일주일에 한 번)</label>
        <input id="nameIn" maxlength="12" autocomplete="off" spellcheck="false">
        <div class="renameBtns"><button class="btn primary" id="nameSave" type="submit">바꾸기</button><button class="btn" id="nameCancel" type="button">취소</button></div>
        <p class="renameMsg" id="nameMsg" aria-live="polite"></p>
      </form>
      <p class="sub" id="mRecord"></p>
      <div class="mainBtns">
        <button class="btn" id="mContinue" hidden></button>
        <button class="btn" id="mNew">새 접속</button>
        <button class="btn ascBtn" id="mAsc" hidden></button>
        <button class="btn abyssBtn" id="mAbyss">심층부로</button>
      </div>
      <div class="subBtns">
        <button class="subBtn" id="mTree">모듈</button>
        <button class="subBtn" id="mBadge">아카이브</button>
      </div>
      <div class="board mini" id="mBoard" aria-live="polite"></div>
      <button class="linkbtn" id="mRank">순위표 전체 보기</button>
      <div class="sndRow"><button class="sndBtn" id="mBgm"></button><button class="sndBtn" id="mSfx"></button><button class="sndBtn" id="mTheme"></button></div>
      <div class="legalRow"><a class="linkbtn" href="privacy.html" target="_blank" rel="noopener">개인정보 처리방침</a><button class="linkbtn" id="mDelete" aria-expanded="false" aria-controls="deleteForm">내 기록 삭제</button></div>
      <div class="deleteForm" id="deleteForm" hidden>
        <p>순위표에서 호출명과 접속 기록을 지운다. 이 기기의 진행도(모듈·아카이브)는 그대로 남고, 호출명은 새로 정해진다. 되돌릴 수 없다.</p>
        <div class="renameBtns"><button class="btn danger" id="deleteGo" type="button">순위표 기록 지우기</button><button class="btn" id="deleteCancel" type="button">취소</button></div>
        <p class="renameMsg" id="deleteMsg" aria-live="polite"></p>
      </div>
    </div>

    <div class="ov" id="ovRank">
      <div class="big">순위표</div>
      <p class="sub" id="rankSub"></p>
      <ol class="board" id="rankList"></ol>
      <button class="btn" id="rankBack">돌아가기</button>
    </div>

    <div class="ov ovTree" id="ovTree">
      <div class="big">모듈</div>
      <p class="sub" id="treeSub"></p>
      <div class="treeBox" id="treeBox"></div>
      <div class="treeInfo" id="treeInfo" aria-live="polite"></div>
      <button class="btn" id="treeBack">돌아가기</button>
    </div>

    <div class="ov ovBadge" id="ovBadge">
      <div class="big">아카이브</div>
      <p class="sub" id="badgeSub"></p>
      <ul class="badgeBox" id="badgeBox"></ul>
      <button class="btn" id="badgeBack">돌아가기</button>
    </div>

    <div class="ov ovMap" id="ovMap">
      <div class="mapHead"><div class="t" id="mapTitle"></div><div class="depth" id="mapDepth" role="img"></div><div class="s" id="mapSub"></div><div class="mapStory" id="mapStory"></div></div>
      <div class="mapBox" id="mapBox"></div>
    </div>

    <div class="ov" id="ovChoose">
      <canvas class="sceneCv" id="sceneCv" aria-hidden="true" hidden></canvas>
      <div class="big" id="cTitle"></div>
      <p class="sub" id="cSub"></p>
      <div class="cards" id="cCards"></div>
      <div class="btnRow" id="cBtns"></div>
    </div>

    <!-- 대사 장면: 화면 어디를 눌러도 다음 줄. 건너뛰기는 늘 보인다 -->
    <div class="ov ovTalk" id="ovTalk">
      <div class="tTitle" id="tTitle"></div>
      <div class="lcd" id="tLcd" aria-hidden="true" hidden></div>
      <ol class="tLog" id="tLog" aria-live="polite"></ol>
      <div class="btnRow"><button class="btn primary" id="tNext">다음</button><button class="btn" id="tSkip">건너뛰기</button></div>
    </div>

  </div></div>
  <!-- 일시정지는 판(.stageWrap, 크기 컨테이너) 밖에 둔다: 컨테이너 안의 position:fixed는 화면이 아니라 컨테이너를 기준으로 잡혀 전체 화면을 덮지 못한다(css-contain-3) -->
  <div class="ov" id="ovPause">
    <div class="big">일시정지</div>
    <button class="btn primary" id="pResume">계속하기</button>
    <button class="btn" id="pMain">터미널<small id="pMainSub"></small></button>
    <div class="sndRow"><button class="sndBtn" id="pBgm"></button><button class="sndBtn" id="pSfx"></button><button class="sndBtn" id="pTheme"></button></div>
    <button class="linkbtn" id="pGiveup">접속 포기</button>
  </div>
<p class="playHint" id="playHint">조준선에 맞춰 탭 · Space / Enter 발사</p>
</div>

<!-- 순서가 곧 의존 관계: 앞 파일의 전역을 뒤 파일이 쓴다. ES 모듈은 file://에서 막혀서 일반 script로 둔다 -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/story.js"></script>
<script src="js/sprites.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/profile.js"></script>
<script src="js/net.js"></script>
<script src="js/map.js"></script>
<script src="js/battle.js"></script>
<script src="js/render.js"></script>
<script src="js/scene.js"></script>
<script src="js/talk.js"></script>
<script src="js/screens.js"></script>
<script src="js/rewards.js"></script>
<script src="js/main.js"></script>
</body>
</html>
