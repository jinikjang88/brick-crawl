<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브릭 크롤</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="brandStrip"><span>BRICK / CRAWL</span><span>구슬로 여는 원정</span></div>
  <header class="hud">
    <div>
      <div class="hStage" id="hStage"></div>
      <div class="hName" id="hName">브릭 크롤</div>
    </div>
    <div class="hRight">
      <span class="hCoin" id="hCoin"></span>
      <button class="iconBtn" id="btnMenu" aria-label="메뉴">II</button>
    </div>
  </header>
  <div class="orbBar" id="orbBar"></div>
  <div class="abil" id="abil" aria-label="보유 유물"></div>

  <div class="stageWrap"><div class="stage">
    <canvas id="cv" aria-label="위는 전투 화면, 아래는 벽돌판"></canvas>
    <div class="banner" id="banner"><div class="b1" id="bn1"></div><div class="b2" id="bn2"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="ov on ovMain" id="ovMain">
      <canvas class="logoCv" id="logoCv" role="img" aria-label="BRICK CRAWL"></canvas>
      <div class="logo">브릭 크롤</div>
      <div class="orbShowcase" id="orbShowcase" aria-hidden="true"></div>
      <p class="tagline">성벽을 깨고, 운명을 튕겨라.</p>
      <div class="who"><span class="whoLbl">플레이어</span><b id="mName"></b></div>
      <p class="sub" id="mRecord"></p>
      <div class="mainBtns">
        <button class="btn" id="mContinue" hidden></button>
        <button class="btn" id="mNew">새 원정</button>
        <button class="btn abyssBtn" id="mAbyss">심연으로</button>
      </div>
      <div class="subBtns">
        <button class="subBtn" id="mTree">스킬 트리</button>
        <button class="subBtn" id="mBadge">배지</button>
      </div>
      <div class="board mini" id="mBoard" aria-live="polite"></div>
      <button class="linkbtn" id="mRank">랭킹 전체 보기</button>
      <div class="sndRow"><button class="sndBtn" id="mBgm"></button><button class="sndBtn" id="mSfx"></button><button class="sndBtn" id="mTheme"></button></div>
    </div>

    <div class="ov" id="ovRank">
      <div class="big">랭킹</div>
      <p class="sub" id="rankSub"></p>
      <ol class="board" id="rankList"></ol>
      <button class="btn" id="rankBack">돌아가기</button>
    </div>

    <div class="ov ovTree" id="ovTree">
      <div class="big">스킬 트리</div>
      <p class="sub" id="treeSub"></p>
      <div class="treeBox" id="treeBox"></div>
      <div class="treeInfo" id="treeInfo" aria-live="polite"></div>
      <button class="btn" id="treeBack">돌아가기</button>
    </div>

    <div class="ov ovBadge" id="ovBadge">
      <div class="big">배지</div>
      <p class="sub" id="badgeSub"></p>
      <ul class="badgeBox" id="badgeBox"></ul>
      <button class="btn" id="badgeBack">돌아가기</button>
    </div>

    <div class="ov ovMap" id="ovMap">
      <div class="mapHead"><div class="t" id="mapTitle"></div><div class="s" id="mapSub"></div></div>
      <div class="mapBox" id="mapBox"></div>
    </div>

    <div class="ov" id="ovChoose">
      <canvas class="sceneCv" id="sceneCv" aria-hidden="true" hidden></canvas>
      <div class="big" id="cTitle"></div>
      <p class="sub" id="cSub"></p>
      <div class="cards" id="cCards"></div>
      <div class="btnRow" id="cBtns"></div>
    </div>

    <div class="ov" id="ovPause">
      <div class="big">메뉴</div>
      <button class="btn primary" id="pResume">계속하기</button>
      <button class="btn" id="pMain">메인 화면<small id="pMainSub"></small></button>
      <div class="sndRow"><button class="sndBtn" id="pBgm"></button><button class="sndBtn" id="pSfx"></button><button class="sndBtn" id="pTheme"></button></div>
      <button class="linkbtn" id="pGiveup">원정 포기</button>
    </div>
  </div></div>
<p class="playHint" id="playHint">조준선에 맞춰 탭 · Space / Enter 발사</p>
</div>

<!-- 순서가 곧 의존 관계: 앞 파일의 전역을 뒤 파일이 쓴다. ES 모듈은 file://에서 막혀서 일반 script로 둔다 -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/profile.js"></script>
<script src="js/net.js"></script>
<script src="js/map.js"></script>
<script src="js/battle.js"></script>
<script src="js/render.js"></script>
<script src="js/scene.js"></script>
<script src="js/screens.js"></script>
<script src="js/rewards.js"></script>
<script src="js/main.js"></script>
</body>
</html>
