<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>브릭 크롤 동작 프레임</title>
<style>body{background:#0b0d10;color:#e6e2d6;font:16px system-ui;margin:24px}button,select{font:inherit;min-height:44px;padding:10px;margin:4px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{background:#14181c;border:1px solid #3a434a;padding:16px;text-align:center}canvas{width:100%;max-width:320px;image-rendering:pixelated}h1{font-size:22px}h2{font-size:16px;margin:0 0 8px}</style>
<h1>브릭 크롤 · 동작 프레임 점검</h1>
<p>릭과 기체 8종 · 공격 / 피격 / 사망 / 스킬 · 각 6프레임. "한 칸씩"으로 멈춰 놓고 좌우·이음매를 본다(점검 항목은 action-frames.md).</p>
<select id="action" aria-label="동작"><option value="0">공격</option><option value="1">피격</option><option value="2">사망</option><option value="3">스킬</option></select>
<button id="pause">일시정지</button><button id="step">한 칸씩 ▶</button>
<label>속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select></label> <span id="frameNo"></span>
<main id="grid"></main>
<script>
// 게임과 같은 시트(assets/game/*_actions.png)와 같은 프레임 시간(js/art.js)을 쓴다
const names={rick:'릭',sludge:'나노 슬러지',drone:'경비 드론',guardian:'방벽 가디언',disperser:'오염 살포기',sentinel:'센티넬',gemini:'제미디',claude:'클라드',omnis:'OMNIS'};
const clips=[[.06,.06,.05,.06,.09,.10],[.035,.04,.055,.05,.06,.08],[.10,.10,.12,.12,.14,.16],[.07,.08,.07,.08,.10,.10]];
const views=[];for(const [name,label]of Object.entries(names)){const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),image=new Image();title.textContent=label;canvas.width=canvas.height=320;image.src='../../assets/game/'+name+'_actions.png';article.append(title,canvas);grid.append(article);views.push({canvas,image});}
let stopped=false,t=0,last=0,manual=-1;
pause.onclick=()=>{stopped=!stopped;manual=-1;pause.textContent=stopped?'재생':'일시정지'};
step.onclick=()=>{stopped=true;pause.textContent='재생';manual=(manual+1)%6};
action.onchange=()=>{t=0;if(manual>=0)manual=0};
function tick(now){if(!stopped)t+=(now-last)/1000*Number(speed.value);last=now;const row=Number(action.value),times=clips[row],duration=times.reduce((a,b)=>a+b,0);let elapsed=t%(duration+.65),col=0;while(col<5&&elapsed>=times[col])elapsed-=times[col++];if(manual>=0)col=manual;frameNo.textContent='프레임 '+(col+1)+' / 6';for(const {canvas,image}of views){const c=canvas.getContext('2d');c.clearRect(0,0,320,320);if(image.complete&&image.naturalWidth){const cell=image.naturalWidth/6;c.drawImage(image,col*cell,row*cell,cell,cell,0,0,320,320)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
